<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>ReactCut Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: toolbar on top; left column = canvas stage over timeline; right column = Workshop. Single dark look by design. */
:root{--bg:#0F0F0F;--panel:#181818;--line:#262626;--text:#FFFFFF;--muted:#8E8E93;--accent:#00F0FF;--hover:#222222;--danger:#FF6B6B;--clip:#232323;
--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);overflow:auto}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=password],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;outline:0;-webkit-user-select:text;user-select:text}
input:focus-visible,select:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
#app{display:flex;flex-direction:column;height:100%;min-width:1100px;min-height:640px}
/* toolbar */
#toolbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-weight:700;letter-spacing:-.02em;margin-right:14px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border:1.5px solid var(--accent);transform:rotate(45deg)}
.tbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn.active{color:var(--accent)}
.tbtn.active svg{fill:var(--accent)}
.tbtn:disabled{opacity:.35;pointer-events:none}
.tbtn.danger:hover{color:var(--danger)}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.spacer{flex:1}
.ctx{display:flex;align-items:center;gap:4px}
.mini{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:none;cursor:pointer;width:80px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3a3a3a;border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:#3a3a3a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;margin-top:-4px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:0}
.primary{background:var(--accent);color:#000;font-weight:600;height:32px;padding:0 16px;border-radius:8px;display:flex;align-items:center;gap:6px}
.primary:hover{filter:brightness(.92)}
.pop-wrap{position:relative}
.popover{position:absolute;top:38px;left:0;z-index:60;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.popover button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:7px;text-align:left}
.popover button:hover{background:var(--hover)}
.popover button svg{color:var(--muted)}
.pill-user{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border:1px solid var(--line);border-radius:999px;margin-right:6px}
.pill-user:hover{background:var(--hover)}
.avatar{width:24px;height:24px;border-radius:50%;background:#2b2b2b;display:grid;place-items:center;font-size:11px;font-weight:600;text-transform:uppercase}
/* body */
#body{flex:1;display:flex;min-height:0}
#work{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#canvasArea{flex:1;display:flex;flex-direction:column;min-height:0}
#textBar{height:44px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;visibility:hidden}
#textBar.on{visibility:visible}
#textBar .grp{display:flex;align-items:center;gap:4px;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
#textBar select{height:24px;padding:0 6px;border-radius:6px;border:0;background:none}
#textBar select option{background:#181818}
#textBar button{height:24px;min-width:24px;padding:0 6px;border-radius:6px;font-size:12px}
#textBar button:hover{background:var(--hover)}
#textBar button.on{color:var(--accent)}
#textBar input[type=color]{width:18px;height:18px;border:1px solid #3a3a3a;border-radius:50%;padding:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
#textBar input[type=color]::-webkit-color-swatch-wrapper{padding:0}
#textBar input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
#stageArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#stageBox{position:relative;flex:none;border:1px solid var(--line)}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:#000;overflow:hidden}
.layer{position:absolute;left:0;top:0;transform-origin:center}
.layer canvas{display:block}
.textlayer{white-space:pre;text-align:center;line-height:1.2;cursor:move}
.textlayer[contenteditable=true]{cursor:text;outline:1px dashed var(--accent);-webkit-user-select:text;user-select:text}
#sel{position:absolute;border:1px solid var(--accent);pointer-events:none;display:none;z-index:50}
#sel .h{position:absolute;width:10px;height:10px;background:#fff;border:1px solid var(--accent);border-radius:2px;pointer-events:auto}
#sel .h[data-h=tl]{left:-6px;top:-6px;cursor:nwse-resize}
#sel .h[data-h=tr]{right:-6px;top:-6px;cursor:nesw-resize}
#sel .h[data-h=bl]{left:-6px;bottom:-6px;cursor:nesw-resize}
#sel .h[data-h=br]{right:-6px;bottom:-6px;cursor:nwse-resize}
#sel .rot{position:absolute;left:50%;top:-28px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:1px solid var(--accent);cursor:grab;pointer-events:auto}
#sel .rot::after{content:"";position:absolute;left:5px;top:12px;width:1px;height:15px;background:var(--accent)}
#path{position:absolute;left:0;top:0;pointer-events:none;z-index:40;overflow:visible}
.ratio{position:absolute;right:16px;bottom:10px;color:var(--muted);font-size:11px;font-family:var(--mono)}
/* timeline */
#timeline{height:340px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column}
#tlHead{height:40px;flex:none;display:flex;align-items:center;justify-content:center;gap:14px;border-bottom:1px solid var(--line);position:relative}
#btnPlay{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
#btnPlay:hover{background:var(--hover)}
#btnPlay svg{fill:#fff}
#timecode{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
#timecode span{color:var(--muted)}
.zoom{position:absolute;right:14px;display:flex;align-items:center;gap:8px;color:var(--muted)}
#tlBody{flex:1;display:flex;min-height:0}
#tlSide{width:84px;flex:none;border-right:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.cover{width:54px;height:54px;border-radius:10px;border:1px solid #333;background:var(--panel) center/cover;position:relative;display:grid;place-items:center}
.cover:hover{border-color:#555}
.cover .pen{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#000;border:1px solid #333;display:grid;place-items:center}
.cover .pen svg{width:11px;height:11px}
.cl{font-size:10px;color:var(--muted);margin-top:-4px}
.sq{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.sq:hover{background:var(--hover);color:#fff}
#tlScroll{flex:1;overflow:auto;position:relative}
#tlContent{position:relative;min-height:100%}
#ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);cursor:pointer}
#ruler .tk{position:absolute;bottom:0;width:1px;height:5px;background:#3a3a3a}
#ruler .tk.m{height:9px;background:#5a5a5e}
#ruler .tl{position:absolute;top:3px;transform:translateX(-50%);font-size:10px;color:var(--muted);font-family:var(--mono)}
.row{position:relative;border-bottom:1px solid #1c1c1c}
.rpill{position:sticky;left:12px;top:0;display:inline-flex;align-items:center;gap:6px;height:24px;margin:8px 0 0 12px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px;cursor:pointer}
.rpill:hover{color:#fff;border-color:#444}
.rpill svg{width:12px;height:12px}
.clip{position:absolute;border-radius:6px;background:var(--clip) left center/auto 100% repeat-x;border:1px solid #363636;overflow:hidden;cursor:grab;color:#fff;font-size:11px}
.clip.sel{outline:1.5px solid var(--accent);outline-offset:-1px;border-color:transparent}
.clip .lbl{position:absolute;left:12px;top:3px;max-width:calc(100% - 52px);padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip .trim{position:absolute;top:0;bottom:0;width:10px;background:#fff;opacity:0;cursor:ew-resize;z-index:2}
.clip .trim::after{content:"";position:absolute;left:4px;top:50%;height:14px;width:2px;margin-top:-7px;background:#000;border-radius:1px}
.clip .trim.tl{left:0;border-radius:6px 0 0 6px}
.clip .trim.tr{right:0;border-radius:0 6px 6px 0}
.clip:hover .trim,.clip.sel .trim{opacity:1}
.clip.txt{background:#2a2a2a}
.clip .ckey{position:absolute;right:14px;top:3px;width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#aaa;z-index:1}
.clip .ckey.on{color:var(--accent)}
.clip .ckey svg{width:12px;height:12px;pointer-events:none}
.kfd{position:absolute;bottom:3px;width:8px;height:8px;margin-left:-4px;background:#fff;transform:rotate(45deg);z-index:1;cursor:pointer}
.clip.sel .kfd{background:var(--accent)}
#playhead{position:absolute;top:0;bottom:0;width:0;z-index:20;pointer-events:none}
#playhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:#fff}
#phHandle{position:absolute;left:-6px;top:0;width:13px;height:16px;background:#fff;border-radius:3px 3px 7px 7px;pointer-events:auto;cursor:ew-resize}
/* workshop */
#workshop{width:320px;flex:none;display:flex;flex-direction:column;background:var(--bg)}
#workshop.flash{box-shadow:inset 0 0 0 1px var(--accent)}
.wh{padding:14px 14px 0}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;border-radius:0}
.search svg{color:var(--muted)}
.tabs{display:flex;gap:18px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:8px 0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-color:var(--accent)}
.wtools{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--panel);border:1px solid var(--line);flex:1}
.seg button{flex:1;height:26px;border-radius:6px;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#2a2a2a;color:#fff}
.ghost{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;flex:1;justify-content:center}
.ghost:hover{background:var(--hover)}
#grid{flex:1;overflow:auto;padding:12px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.card{min-width:0}
.thumb{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.thumb.chk{background:repeating-conic-gradient(#1e1e1e 0 25%,#151515 0 50%) 0 0/16px 16px}
.thumb canvas{width:100%;height:100%;display:block}
.dur{position:absolute;left:6px;bottom:6px;font-size:10px;font-family:var(--mono);background:rgba(0,0,0,.7);padding:1px 6px;border-radius:4px}
.add{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid #444;display:grid;place-items:center}
.add:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.ctitle{margin-top:6px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cby{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0}
.note{grid-column:1/-1;color:var(--muted);font-size:11px;text-align:center}
/* modals */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal{width:380px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.mtabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}
.mtabs button{padding:0 0 10px;color:var(--muted);font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button.on{color:#fff;border-color:var(--accent)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;height:40px;padding:0 12px;background:var(--bg)}
.fld input:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:12px;min-height:18px;margin-bottom:8px}
.big{width:100%;height:40px;border-radius:8px;background:var(--accent);color:#000;font-weight:600}
.guest{display:block;margin:16px auto 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.guest:hover{color:#fff}
.mh{font-weight:600;font-size:15px;margin-bottom:4px}
.msub{color:var(--muted);margin-bottom:18px}
.bar{height:4px;border-radius:4px;background:#2a2a2a;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.row2{display:flex;gap:8px;margin-top:18px}
.row2 button{flex:1;height:36px;border-radius:8px;border:1px solid var(--line)}
.row2 button:hover{background:var(--hover)}
.row2 .pr{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
#coverPrev{width:135px;height:240px;margin:0 auto;border-radius:8px;border:1px solid var(--line);background:#000 center/cover}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:#222;border:1px solid #333;padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (max-width:1320px){.tbtn span.t{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
 <header id="toolbar">
  <div class="brand"><i></i>ReactCut</div>
  <div class="pop-wrap">
   <button class="tbtn" id="btnAddMedia" title="Add Media"><i data-lucide="image-plus"></i><span class="t">Add Media</span></button>
   <div class="popover" id="mediaPop" hidden>
    <button id="popWorkshop"><i data-lucide="library"></i>From Site Workshop</button>
    <button id="popDevice"><i data-lucide="smartphone"></i>From Device Gallery</button>
   </div>
  </div>
  <button class="tbtn" id="btnAddText" title="Add Text"><i data-lucide="type"></i><span class="t">Add Text</span></button>
  <button class="tbtn" id="btnKey" title="Keyframe (K)"><i data-lucide="diamond"></i><span class="t">Keyframes</span></button>
  <div class="ctx" id="ctx" hidden>
   <div class="sep"></div>
   <button class="tbtn" id="btnChroma" title="Chroma Key"><i data-lucide="pipette"></i><span class="t">Chroma Key</span></button>
   <label class="mini" id="simWrap" title="Key tolerance">Key <input type="range" id="sim" min="0" max="100" value="50" style="width:60px"></label>
   <label class="mini" id="opWrap" title="Opacity"><i data-lucide="droplet"></i><input type="range" id="op" min="5" max="100" value="100" style="width:64px"></label>
   <div class="pop-wrap" id="layerWrap">
    <button class="tbtn" id="btnLayer" title="Layer Order"><i data-lucide="layers"></i><span class="t">Layer Order</span></button>
    <div class="popover" id="layerPop" hidden>
     <button data-lo="front"><i data-lucide="bring-to-front"></i>Bring to Front</button>
     <button data-lo="up"><i data-lucide="arrow-up"></i>Forward</button>
     <button data-lo="down"><i data-lucide="arrow-down"></i>Backward</button>
     <button data-lo="back"><i data-lucide="send-to-back"></i>Send to Back</button>
    </div>
   </div>
   <button class="tbtn danger" id="btnDel" title="Delete"><i data-lucide="trash-2"></i><span class="t">Delete</span></button>
  </div>
  <div class="spacer"></div>
  <div class="pop-wrap" id="userWrap" hidden>
   <button class="pill-user" id="userPill"><span class="avatar" id="avatar">G</span><span id="uname">Guest</span></button>
   <div class="popover" id="userPop" hidden style="left:auto;right:0;min-width:150px"><button id="logout"><i data-lucide="log-out"></i>Log out</button></div>
  </div>
  <button class="primary" id="btnExport"><i data-lucide="download"></i>Export</button>
 </header>

 <div id="body">
  <main id="work">
   <section id="canvasArea">
    <div id="textBar">
     <div class="grp"><select id="tFont" title="Font"><option>Inter</option><option>Impact</option><option>Georgia</option><option>Courier New</option><option>Comic Sans MS</option><option>Arial Black</option></select></div>
     <div class="grp"><button id="tMinus">A−</button><button id="tPlus">A+</button><button id="tBold"><b>B</b></button><input type="color" id="tColor" title="Text color"></div>
     <div class="grp"><button id="tStroke">Stroke</button><input type="color" id="tStrokeC" title="Stroke color"></div>
     <div class="grp"><button id="tPill">Pill</button><input type="color" id="tPillC" title="Background color"></div>
    </div>
    <div id="stageArea">
     <div id="stageBox">
      <div id="stage"></div>
      <svg id="path"></svg>
      <div id="sel"><span class="h" data-h="tl"></span><span class="h" data-h="tr"></span><span class="h" data-h="bl"></span><span class="h" data-h="br"></span><span class="rot"></span></div>
     </div>
     <span class="ratio">9:16</span>
    </div>
   </section>
   <section id="timeline">
    <div id="tlHead">
     <button id="btnPlay" title="Play / Pause (Space)"><i data-lucide="play"></i></button>
     <div id="timecode">00:00 <span>/ 00:15</span></div>
     <label class="zoom"><i data-lucide="search"></i><input type="range" id="zoom" min="32" max="140" value="64"></label>
    </div>
    <div id="tlBody">
     <div id="tlSide">
      <button class="cover" id="btnCover" title="Cover (Обложка)"><span class="pen"><i data-lucide="pencil"></i></span></button>
      <span class="cl">Cover</span>
      <button class="sq" id="sideAudio" title="Audio"><i data-lucide="music"></i></button>
      <button class="sq" id="sideText" title="Text"><i data-lucide="type"></i></button>
     </div>
     <div id="tlScroll">
      <div id="tlContent">
       <div id="ruler"></div>
       <div id="rows"></div>
       <div id="playhead"><div id="phHandle"></div></div>
      </div>
     </div>
    </div>
   </section>
  </main>

  <aside id="workshop">
   <div class="wh">
    <label class="search"><i data-lucide="search"></i><input type="search" id="q" placeholder="Search assets or @creators..." autocomplete="off"></label>
    <div class="tabs" id="tabs">
     <button class="tab on" data-tab="footage">Footage</button><button class="tab" data-tab="image">Images</button><button class="tab" data-tab="bg">Backgrounds</button><button class="tab" data-tab="audio">Audio</button>
    </div>
   </div>
   <div class="wtools" id="wtools"></div>
   <div id="grid"></div>
  </aside>
 </div>
</div>

<input type="file" id="fileDevice" accept="image/*,video/*,audio/*" hidden>
<input type="file" id="fileUp" hidden>
<input type="file" id="fileWs" accept="video/*" hidden>
<input type="file" id="fileCover" accept="image/*" hidden>

<div class="overlay" id="auth">
 <form class="modal" id="authForm" novalidate>
  <div class="mtabs"><button type="button" class="on" data-m="up">Sign Up</button><button type="button" data-m="in">Log In</button></div>

 else items=lib[t].filter(a=>!q||(q[0]==='@'?a.creator.toLowerCase().includes(q.slice(1)):(a.name+' '+a.creator).toLowerCase().includes(q)));

function composite(){const cv=document.createElement('canvas');cv.width=360;cv.height=640;const x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,360,640);
 const vis=S.clips.filter(c=>isVis(c)&&rt[c.id]&&rt[c.id].active).sort((a,b)=>a.z-b.z);
 for(const c of vis){const R=rt[c.id],tf=tfAt(c,S.t);x.save();x.globalAlpha=c.opacity;x.translate(tf.x,tf.y);x.rotate(tf.r*Math.PI/180);x.scale(tf.s,tf.s);
  if(c.type==='text'){x.font=`${c.bold?800:400} ${c.size}px ${c.font}`;x.textAlign='center';x.textBaseline='middle';const ls=c.text.split('\n'),lh=c.size*1.2;
   if(c.pill){x.fillStyle=c.pillColor;rr(x,-c.w/2,-c.h/2,c.w,c.h,22);x.fill()}
   ls.forEach((l,i)=>{const y=(i-(ls.length-1)/2)*lh;if(c.stroke){x.lineWidth=c.strokeW*2;x.lineJoin='round';x.strokeStyle=c.strokeColor;x.strokeText(l,0,y)}x.fillStyle=c.color;x.fillText(l,0,y)})}
  else x.drawImage(R.cv,-c.w/2,-c.h/2,c.w,c.h);x.restore()}
 return cv}
function frameAt(t){const o=S.t;S.t=t;renderStage();const cv=composite();S.t=o;renderStage();return cv.toDataURL('image/jpeg',.8)}
function setCover(u){S.cover=u;$('#btnCover').style.backgroundImage=`url(${u})`;$('#coverPrev').style.backgroundImage=`url(${u})`}

const SB_URL='https://ispgiptiuxjxnrqijpxc.supabase.co',SB_KEY='sb_publishable_hoYqml9IMBSfIo3Ugyoghw_NLLpJ7Qu',BUCKET='footages';

function remoteAsset(o){const id='r_'+hash(o.key);if(A[id])return A[id];
 const base={id,kind:o.kind,name:o.name,creator:o.creator||'workshop',remote:1,url:o.url};let a;
 if(o.kind==='footage'){a=reg({...base,type:'video',nw:360,nh:640,dur:5,finite:5,timeBased:true,chroma:false,ready:false});
  const v=document.createElement('video');v.crossOrigin='anonymous';v.muted=true;v.preload='auto';v.playsInline=true;v.src=o.url;
  v.onloadedmetadata=()=>{a.nw=v.videoWidth||360;a.nh=v.videoHeight||640;a.dur=a.finite=isFinite(v.duration)?v.duration:5;try{v.currentTime=Math.min(.1,v.duration/2)}catch(e){}};
  v.onseeked=()=>{const cv=document.createElement('canvas');cv.width=160;cv.height=Math.round(160*a.nh/a.nw)||284;try{cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height)}catch(e){}a.thumbEl=cv;a.ready=true;delete thumbCache[id];renderGrid();renderTimeline()};
  v.onerror=()=>{a.failed=true}}
 else if(o.kind==='audio'){a=reg({...base,type:'audio',dur:3,finite:3,timeBased:true,ready:false});
  fetch(o.url).then(r=>r.arrayBuffer()).then(b=>AC().decodeAudioData(b)).then(b=>{a.buffer=b;a.chan=b.getChannelData(0);a.dur=a.finite=b.duration;a.peaks=null;a.ready=true;renderGrid()}).catch(()=>{a.failed=true})}
 else{const img=new Image();img.crossOrigin='anonymous';a=reg({...base,type:'image',el:img,thumbEl:img,nw:360,nh:360,dur:4,static:true,ready:false});
  img.onload=()=>{a.nw=img.naturalWidth;a.nh=img.naturalHeight;a.ready=true;renderGrid()};img.onerror=()=>{a.failed=true};img.src=o.url}
 return a}
async function listBucket(prefix,depth){const{data,error}=await sb.storage.from(BUCKET).list(prefix,{limit:200,sortBy:{column:'name',order:'asc'}});if(error)throw error;let out=[];
 for(const f of data||[]){const path=prefix?prefix+'/'+f.name:f.name;if(f.id===null||f.id===undefined){if(depth>0)out=out.concat(await listBucket(path,depth-1))}else if(/\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name)||String(f.metadata&&f.metadata.mimetype||'').startsWith('video/'))out.push({path,name:f.name})}
 return out}
async function loadRemote(){if(!sb){toast('Supabase is not reachable. Showing built-in assets only.');return}

 try{const{data,error}=await sb.from('workshop_items').select('title,author,category,file_url');if(error)throw error;
  for(const r of data||[]){if(!r.file_url||seen.has(r.file_url))continue;seen.add(r.file_url);const k=catKind(r.category);lib[k].push(remoteAsset({key:r.file_url,kind:k,name:r.title||'Untitled',creator:r.author||'workshop',url:r.file_url}))}}
 catch(e){problems.push('table: '+(e.message||e))}

 catch(e){problems.push('storage: '+(e.message||e))}

 if(!/^\S+@\S+\.\S+$/.test(em))err='Enter a valid email address.';else if(mode==='up'&&un.length<2)err='Choose a username with at least 2 characters.';else if(pw.length<6)err='Password needs at least 6 characters.';
 if(err){showMsg(err);return}
 if(!sb){showMsg('Could not reach Supabase. Check your connection or continue as guest.');return}
 const go=$('#aGo');go.disabled=true;const label=go.textContent;go.textContent='Please wait…';
 try{if(mode==='up'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un}}});if(error)throw error;
   if(data.session)login(userFrom(data.user));
   else if(data.user&&data.user.identities&&!data.user.identities.length){showMsg('That email already has an account. Try Log In.')}
   else{setMode('in');showMsg('Account created. Confirm your email, then log in.',true)}}
  else{const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;login(userFrom(data.user))}}
 catch(ex){showMsg(ex.message||'Something went wrong. Try again.')}
